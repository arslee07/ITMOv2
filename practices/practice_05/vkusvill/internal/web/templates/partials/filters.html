{{ define "filters.html" }}
<form id="filter-form"
      class="p-4 bg-white border-b border-slate-200 space-y-3">

  <input type="hidden" name="page" id="filter-page" value="1">
  <input type="hidden" name="feature_id" id="filter-feature-id" value="{{ .SelectedFeat }}">
  <input type="hidden" name="lat" id="filter-lat" value="">
  <input type="hidden" name="lon" id="filter-lon" value="">

  <!-- Search & Geolocation Row -->
  <div class="flex items-center gap-2">
    <div class="relative flex-1">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <input type="text"
             name="q"
             id="search-input"
             value="{{ .SearchQuery }}"
             placeholder="Поиск по адресу, метро..."
             aria-label="Поиск по адресу или станции метро"
             autocomplete="off"
             spellcheck="false"
             class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus:bg-white transition-all">
    </div>

    <!-- Geolocation Button -->
    <button type="button"
            id="geo-btn"
            onclick="window.locateUser()"
            title="Найти магазины рядом со мной"
            class="p-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg transition-colors flex items-center justify-center flex-shrink-0 cursor-pointer focus-visible:ring-2 focus-visible:ring-emerald-500 focus:outline-none"
            aria-label="Найти магазины рядом со мной">
      <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 1.105-.895 2-2 2s-2-.895-2-2 .895-2 2-2 2 .895 2 2zm0 0c0 4-5 9-5 9s-5-5-5-9a5 5 0 0110 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      </svg>
    </button>
  </div>

  <!-- City & Region Selectors -->
  <div class="flex items-center gap-2">
    <div class="flex-1">
      <select name="city_id"
              id="city-select"
              aria-label="Выбор города"
              class="w-full py-1.5 px-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus:bg-white cursor-pointer">
        <option value="0">Все города</option>
        <option value="6423" {{ if eq .SelectedCity 6423 }}selected{{ end }}>г. Москва</option>
        <option value="6431" {{ if eq .SelectedCity 6431 }}selected{{ end }}>г. Санкт-Петербург</option>
        {{ range .Cities }}
          {{ if and (ne .ID 6423) (ne .ID 6431) }}
          <option value="{{ .ID }}" {{ if eq $.SelectedCity .ID }}selected{{ end }}>{{ .Name }}</option>
          {{ end }}
        {{ end }}
      </select>
    </div>

    <!-- Clear Filter Button -->
    <button type="button"
            onclick="window.resetFilters()"
            class="px-2.5 py-1.5 text-xs text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition-colors border border-transparent hover:border-slate-200 cursor-pointer">
      Сбросить
    </button>
  </div>

  <!-- Quick Feature Filter Chips -->
  <div class="pt-1">
    <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
      Удобства и сервисы
    </div>
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
      <button type="button"
              onclick="window.toggleFeature(0)"
              class="px-2.5 py-1 rounded-full border transition-all whitespace-nowrap cursor-pointer {{ if eq .SelectedFeat 0 }}bg-emerald-600 text-white border-emerald-600 font-semibold shadow-sm{{ else }}bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200{{ end }}">
        Все
      </button>

      {{ range .QuickChips }}
      <button type="button"
              onclick="window.toggleFeature({{ .ID }})"
              class="px-2.5 py-1 rounded-full border transition-all whitespace-nowrap cursor-pointer flex items-center gap-1 {{ if .Active }}bg-emerald-600 text-white border-emerald-600 font-semibold shadow-sm{{ else }}bg-slate-50 text-slate-700 border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/50{{ end }}">
        {{ if eq .IconType "coffee" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>
        {{ else if eq .IconType "orange" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" d="M12 6v6l4 2"/></svg>
        {{ else if eq .IconType "croissant" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        {{ else if eq .IconType "wine" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l7-7 3 3-7 7-3-3z M18 13l-1.5-7.5L2 2l3.5 14.5L18 13z"/></svg>
        {{ else if eq .IconType "battery" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="7" width="16" height="10" rx="2" stroke-width="2"/><path d="M22 11v2" stroke-width="2" stroke-linecap="round"/></svg>
        {{ else if eq .IconType "recycle" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        {{ else if eq .IconType "fish" }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
        {{ else }}
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        {{ end }}
        <span>{{ .Name }}</span>
      </button>
      {{ end }}
    </div>
  </div>
</form>
{{ end }}
