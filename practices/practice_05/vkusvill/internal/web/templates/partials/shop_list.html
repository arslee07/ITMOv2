{{ define "shop_list.html" }}
<div id="shops-list-container" class="flex flex-col h-full">
  <!-- List Header / Stats -->
  <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600">
    <div class="flex items-center gap-2">
      <span class="font-semibold text-slate-800">Магазины</span>
      <span id="shops-count" class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-medium">{{ .TotalShops }}</span>
    </div>
    <div id="shops-progress" class="text-slate-400 font-medium"></div>
  </div>

  <!-- Cards Scroll Area (filled incrementally by app.js) -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3" id="shops-cards">
    <div class="py-12 text-center text-slate-500">
      <svg class="mx-auto w-12 h-12 text-slate-300 mb-3" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
      </svg>
      <p class="font-medium text-slate-700">Загрузка магазинов…</p>
      <p class="text-xs text-slate-400 mt-1">Список наполняется по мере загрузки каталога</p>
    </div>
  </div>
</div>
{{ end }}
